# Render blueprint for Orkora.
#
# What this provisions:
#   - orkora-api      Node web service (NestJS) running the API
#   - orkora-redis    managed Redis instance (rate-limit cache, future queues)
#
# Database: Neon (managed externally, NOT provisioned here). DATABASE_URL is
# pasted manually in the Render dashboard. We deliberately do NOT declare a
# `databases:` block: when we did, a Render-managed Postgres got provisioned
# on every Blueprint apply, was billed separately, and once silently captured
# DATABASE_URL via `fromDatabase` (causing the 2026-06-02 cutover crash where
# the new instance could not resolve `dpg-...-a`). Keep it that way until we
# explicitly migrate off Neon.
#
# Production-readiness notes:
#   - JWT_PRIVATE_KEY / JWT_PUBLIC_KEY are NOT autogenerated; paste them in
#     the Render dashboard after the first apply. See DEPLOY.md.
#   - Object storage (banners, avatars) lives in Cloudflare R2 in production.
#     Render only hosts the API; R2 keys are pasted manually.

services:
  - type: redis
    name: orkora-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: orkora-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Core
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: APP_URL
        sync: false  # set to your Vercel URL after web deploy
      - key: API_URL
        sync: false  # set to https://orkora-api.onrender.com after first deploy
      - key: CORS_ORIGINS
        sync: false  # comma-separated list of allowed origins (Vercel URL, custom domain)

      # First-boot only: applies schema.sql to a fresh DB. Leave false in
      # production; the forward-only migration runner (apps/api/scripts/
      # migrate.mjs) takes over from migration 0001 onward. We had it stuck
      # at 'true' across many deploys which was harmless (the runner is
      # idempotent) but noisy. Flip it back to 'true' only when standing up
      # a brand-new empty database.
      - key: BOOTSTRAP_SCHEMA
        value: 'false'

      # Database: Neon, set manually in the Render dashboard. Do NOT use
      # `fromDatabase:` here - that re-introduces the Render-managed Postgres
      # we removed above and overrides whatever you paste in the dashboard.
      - key: DATABASE_URL
        sync: false  # paste the Neon connection string (postgresql://...neon.tech/...)
      - key: REDIS_URL
        fromService:
          name: orkora-redis
          type: redis
          property: connectionString

      # Auth secrets
      - key: JWT_PRIVATE_KEY
        sync: false  # paste full PEM (multi-line, double-quoted)
      - key: JWT_PUBLIC_KEY
        sync: false  # paste full PEM (multi-line, double-quoted)
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: TICKET_SIGNING_SECRET
        generateValue: true
      - key: ORDER_HOLD_TTL_MIN
        value: '20'

      # Object storage (Cloudflare R2 in production)
      - key: S3_ENDPOINT
        sync: false  # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_MEDIA
        sync: false  # e.g. orkora-media
      - key: S3_PUBLIC_BASE_URL
        sync: false  # https://media.orkora.events  (custom domain pointed at the R2 bucket)
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: AWS_REGION
        value: auto

      # Notifications
      - key: POSTMARK_TOKEN
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

      # Social login (audience IDs only; ID tokens come from the client)
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: APPLE_OAUTH_CLIENT_ID
        sync: false

      # Payments
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false

      # Observability
      - key: SENTRY_DSN
        sync: false

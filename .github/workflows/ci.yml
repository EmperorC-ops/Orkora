name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: orkora
          POSTGRES_PASSWORD: orkora
          POSTGRES_DB: orkora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Prisma Client is generated, not committed; the API's types depend on it.
      - run: pnpm --filter @orkora/api exec prisma generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://orkora:orkora@localhost:5432/orkora_test
          REDIS_URL: redis://localhost:6379

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orkora/api exec prisma generate
      - run: pnpm build

  # Dedicated web build gate. Runs `next build` on its own, independent of the
  # test job, so a broken import or a page that fails to compile is caught by a
  # clearly named, fast check even if the test suite is red or slow. This is the
  # gate that would have caught the misplaced FeedbackForm import that silently
  # failed every Vercel deploy from 5a72919 onward. Make it a REQUIRED status
  # check in branch protection (see DEPLOY.md) so it blocks the merge.
  web-build:
    name: Build web (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Web does not need the Prisma client, but generating it is cheap and
      # keeps shared type imports resolvable if that ever changes.
      - run: pnpm --filter @orkora/api exec prisma generate
      - run: pnpm --filter @orkora/web build
        env:
          # next build only needs these to exist; a broken import fails the
          # build regardless of their values.
          NEXT_PUBLIC_API_URL: https://api.orkora.events
          NEXT_TELEMETRY_DISABLED: '1'

name: Rotate Secrets

on:
  workflow_dispatch:
    inputs:
      secret_type:
        description: 'Which secrets to rotate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - jwt
          - pepper
          - ticket

jobs:
  rotate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run rotate-secrets script
        run: |
          chmod +x ./scripts/rotate-secrets.sh
          ./scripts/rotate-secrets.sh ${{ github.event.inputs.secret_type }}
        shell: bash

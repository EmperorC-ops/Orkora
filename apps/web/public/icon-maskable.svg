<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant. Same brand mark, but the safe zone is the central
       circle of radius ~204px (per W3C maskable spec, 80% of 512). The
       background extends to all 512px so Android can crop into any shape
       (circle, squircle, rounded square) without losing the wordmark. -->
  <defs>
    <linearGradient id="orkora-grad-mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="60%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#orkora-grad-mask)" />
  <!-- O scaled into the 80% safe zone (radius 100 instead of 138). -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-width="36" />
  <path d="M278 230 L278 282 L320 256 Z" fill="#ffffff" />
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tiny browser-tab favicon. Drops the play hint and keeps just the O,
       so it stays readable at 16x16. -->
  <defs>
    <linearGradient id="orkora-favicon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#orkora-favicon-grad)" />
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ffffff" stroke-width="6" />
</svg>

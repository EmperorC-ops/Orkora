<?xml version="1.0" encoding="UTF-8"?>
<!--
  Orkora brand mark - "Stage rising" (D-prime).

  Composition: a rounded-square plate in the brand purple gradient
  containing a white ring (the venue / stage from above) with an
  upward-pointing triangle inside (energy / agenda / attention rising).
  Reads as "live event in progress with momentum building."

  Designed to survive favicon scale: two chunky shapes (ring + triangle)
  with no thin elements that collapse below 32px. Sharp produces
  pixel-perfect anti-aliased rasters from this master at any density.

  Safe area: the rounded-square fills 88x88 of the 100x100 viewBox,
  leaving a 6-unit transparent margin so the mark can sit adjacent to
  other elements without colliding. The ring sits at r=28 from centre
  (50,50), the triangle is optically centred within the ring.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Orkora">
  <defs>
    <linearGradient id="orkoraPlate" x1="14" y1="6" x2="86" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A78BFA"/>
      <stop offset="55%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- Plate -->
  <rect x="6" y="6" width="88" height="88" rx="22" ry="22" fill="url(#orkoraPlate)"/>

  <!-- Ring: the venue / stage seen from above. Stroke chunky enough that
       at 32px raster the ring remains a continuous, visible shape. -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Upward triangle: rising energy. Apex above geometric centre so the
       optical balance with the ring feels lifted, not sunk. Wide base so
       at favicon size the triangle still reads as a triangle. -->
  <path d="M 50 34 L 36 60 L 64 60 Z" fill="#FFFFFF"/>
</svg>

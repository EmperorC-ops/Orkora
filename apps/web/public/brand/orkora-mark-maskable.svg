<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable variant of the Orkora mark - D-prime.

  PWA maskable icons must keep the brand mark within a centred safe
  zone of 80x80 inside a 100x100 viewBox so OS-level icon shapes
  (circular, rounded-square, squircle) don't crop the ring or the
  triangle. The plate bleeds to the full viewBox in the brand purple
  so the area outside the safe zone still looks intentional.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Orkora">
  <defs>
    <linearGradient id="orkoraPlateM" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A78BFA"/>
      <stop offset="55%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="url(#orkoraPlateM)"/>

  <!-- Mark inset 10% so the OS mask never clips the ring -->
  <g transform="translate(10,10) scale(0.8)">
    <circle cx="50" cy="50" r="28" fill="none" stroke="#FFFFFF" stroke-width="6.25"/>
    <path d="M 50 34 L 36 60 L 64 60 Z" fill="#FFFFFF"/>
  </g>
</svg>
